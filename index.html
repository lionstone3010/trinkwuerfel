<script>
/* Trinkwürfel heißt jetzt SixCup: sofort weiterleiten.
   Auf github.io wird der Aufruf über den alten Link anonym gezählt (GoatCounter, ohne Cookies). */
(function(){
  var target = "/sixcup/?von=trinkwuerfel";
  try {
    if (/github\.io$/.test(location.hostname) && window.fetch)
      fetch("https://trinkwuerfel.goatcounter.com/count?p=" + encodeURIComponent("alter-link") + "&t=" + encodeURIComponent("Über alten Trinkwürfel-Link") + "&e=true&rnd=" + Math.random().toString(36).slice(2), { mode:"no-cors", keepalive:true, credentials:"omit" }).catch(function(){});
  } catch(e){}
  location.replace(target);
})();
</script>
