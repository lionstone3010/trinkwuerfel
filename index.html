<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f3f5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trinkwürfel"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Trinkwürfel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: one column, full-bleed. Während des Spiels färbt sich der ganze Screen in der Farbe der Person, die dran ist. Start und Endstand auf hellem Papier. Bewusst ein eigenes Farbschema, unabhängig vom Systemmodus. */
:root{
  --paper:#f2f3f5;
  --ink:#14151b;
  --ink-soft:#5f6371;
  --drink:#ffc84a;
  --drink-deep:#f2960f;
  --foam:#fffaf0;
  --attack:#e23d28;
  --konter:#0e8a5c;
  --pc:#2b50e8;
  --bg:var(--paper);
  --fg:var(--ink);
  --soft:var(--ink-soft);
  --chip:#ffffff;
  --line:#dcdee4;
  --btn-bg:var(--ink);
  --btn-fg:#ffffff;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
body.color{
  --bg:var(--pc);
  --fg:#ffffff;
  --soft:rgba(255,255,255,.8);
  --chip:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.34);
  --btn-bg:#ffffff;
  --btn-fg:var(--pc);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;transition:background-color .5s ease;-webkit-tap-highlight-color:transparent}
.app{
  max-width:520px;margin:0 auto;box-sizing:border-box;min-height:100%;
  padding-left:max(18px, env(safe-area-inset-left, 0px));
  padding-right:max(18px, env(safe-area-inset-right, 0px));
  padding-block:18px 28px;
  display:flex;flex-direction:column;gap:22px;
}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-.025em;text-wrap:balance;line-height:.95}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.soft{color:var(--soft)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:0 22px;border-radius:999px;box-sizing:border-box;
  background:var(--btn-bg);color:var(--btn-fg);font-weight:800;font-size:17px;transition:transform .1s ease, opacity .2s, background-color .5s, color .5s}
.btn:active{transform:scale(.97)}
.btn .sub{font-weight:600;opacity:.7}
.btn.alt{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{width:20px;height:20px;stroke:currentColor}
.stack{display:flex;flex-direction:column;gap:10px}
.ib{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;transition:background-color .5s}
.ib svg{width:21px;height:21px;stroke:var(--fg)}
.ib[disabled]{opacity:.3;pointer-events:none}
.minis{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--chip);color:var(--fg);font-weight:800;font-size:14px;transition:transform .1s}
.mini:active{transform:scale(.95)}
.mini svg{width:18px;height:18px;stroke:currentColor}
.mini.card-btn{background:rgba(255,255,255,.92);color:var(--pc)}
.mini .dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* Glasses */
.table{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px}
.g{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;border-radius:16px;padding:2px 0;transition:background-color .2s,box-shadow .2s}
.g svg{width:68%;max-width:84px;height:auto;overflow:visible;display:block}
.g .shape{fill:rgba(255,255,255,.12);stroke:var(--fg);stroke-width:2.6;stroke-linejoin:round;transition:stroke .5s}
.g .deco{fill:none;stroke:var(--fg);stroke-width:2.6;stroke-linecap:round;transition:stroke .5s}
.g .base{fill:var(--fg);transition:fill .5s}
.g .liq{fill:var(--drink);transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .7s cubic-bezier(.25,1.5,.45,1)}
.g .liq2{fill:var(--drink-deep);opacity:.5;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .75s cubic-bezier(.25,1.5,.45,1) .05s}
.g .foam{fill:var(--foam);opacity:0;transition:opacity .3s .4s}
.g .shine{stroke:rgba(255,255,255,.55);stroke-width:2.6;stroke-linecap:round;fill:none}
.g.full .liq,.g.full .liq2{transform:scaleY(1)}
.g.full .foam{opacity:1}
.g .gn{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:background-color .2s,color .2s}
.g .gl{font-size:12px;font-weight:700;color:var(--soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g.hit .gn{background:#fff;color:var(--pc)}
.g.hit-fill svg{animation:bob .7s ease}
.g.hit-drink svg{animation:shake .55s ease 2}
.g.tease .gn{background:rgba(255,255,255,.35)}
.g.tease svg{animation:shake .5s ease infinite}
.g.pickable{cursor:pointer;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.g.pickable:active{transform:scale(.96)}
.g.picked{background:rgba(255,255,255,.3);box-shadow:inset 0 0 0 3px #fff}
.g.dim{opacity:.35}
@keyframes bob{40%{transform:translateY(-8px) scale(1.06)}}
@keyframes shake{20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}

/* Intro */
.hero{display:flex;flex-direction:column;gap:12px;padding-top:18px}
.hero h1{font-size:clamp(56px,17vw,86px)}
.hero p{font-size:17px;color:var(--soft);max-width:30ch}
.lineup{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px 0 4px}
.lineup .g .gn{font-size:16px;width:auto;height:auto}
.lineup .g svg{width:86%}
.section{display:flex;flex-direction:column;gap:2px}
.section>.eyebrow{margin-bottom:8px}
.setup{display:flex;flex-direction:column;gap:0}
.setup>.eyebrow{margin-bottom:6px}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.opt .t{font-weight:800}
.opt .d{grid-column:1/-1;font-size:14px;color:var(--soft);margin-top:-2px}
.opt .d b{color:var(--fg)}
.opt .full{grid-column:1/-1}
.switch{width:52px;height:32px;border-radius:999px;background:#d5d8de;position:relative;transition:background-color .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.grow{display:grid;grid-template-columns:28px 1fr;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.grow .num{font-family:var(--display);font-weight:800;font-size:22px}
.seg{display:flex;background:#e4e6eb;border-radius:999px;padding:3px}
.seg button{flex:1;min-height:36px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink-soft);transition:background-color .2s,color .2s;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.field{width:100%;box-sizing:border-box;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.field::placeholder{color:#9a9eaa}
.field:focus{outline:none;border-color:var(--ink)}
.grow .field{grid-column:2}
details.more{border-top:1px solid var(--line);padding-top:14px}
details.more summary{list-style:none;cursor:pointer;font-weight:800;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:10px;height:10px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg) translateY(-3px);transition:transform .2s}
details.more[open] summary::after{transform:rotate(-135deg)}
.rules{margin:12px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--soft)}
.rules b{color:var(--fg)}
.cardlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.cardlist div{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.cardlist .tag{grid-row:span 2;align-self:start;margin-top:2px}
.cardlist b{font-weight:800}
.cardlist span:last-child{color:var(--soft)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:#fff}
.tag.attack{background:var(--attack)}
.tag.konter{background:var(--konter)}
.note{font-size:13px;color:var(--soft);text-align:center}
.startbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom, 0px));z-index:3}
.startbar .btn{box-shadow:0 10px 30px rgba(20,21,27,.25)}

/* Avatars */
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:var(--c);box-shadow:0 0 0 2.5px rgba(255,255,255,.9);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av-s{width:38px;height:38px;font-size:17px}
.av-m{width:50px;height:50px;font-size:22px}
.av-l{width:128px;height:128px;font-size:52px}
.av-xl{width:min(46vw,190px);height:min(46vw,190px);font-size:72px}
.koed .av{filter:grayscale(1)}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.stamp span{font-family:var(--display);font-weight:800;color:#ff3b3b;border:3px solid #ff3b3b;border-radius:8px;padding:0 5px;transform:rotate(-18deg);background:rgba(255,255,255,.85);font-size:12px;line-height:1.3}
.stamp.big span{font-size:clamp(34px,10vw,54px);border-width:6px;border-radius:14px;padding:0 14px;animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{from{transform:rotate(-18deg) scale(2.4);opacity:0}}

/* Join */
.join-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.join-head h1{font-size:clamp(46px,14vw,64px);margin-top:6px}
.handoff{font-weight:700;font-size:15px;background:rgba(0,0,0,.16);border-radius:14px;padding:12px 14px}
.selfie{width:156px;height:156px;border-radius:50%;margin:0 auto;display:grid;place-items:center;overflow:hidden;border:2.5px dashed rgba(255,255,255,.7);color:#fff;font-weight:700;font-size:14px;transition:transform .15s}
.selfie:active{transform:scale(.96)}
.selfie img{width:100%;height:100%;object-fit:cover}
.selfie svg{width:40px;height:40px;stroke:#fff;display:block;margin:0 auto 6px}
.name-input{min-height:60px;border-radius:999px;border:0;background:#fff;color:var(--ink);font-size:22px;font-weight:800;text-align:center;font-family:var(--body)}
.name-input:focus{outline:3px solid rgba(255,255,255,.6);outline-offset:3px}
.seated{display:flex;flex-wrap:wrap;gap:12px 10px}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;width:56px}
.seat span{font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Peek (geheime Karte) */
.peek{align-items:center;text-align:center;justify-content:center}
.peek h1{font-size:clamp(34px,9vw,52px)}
.hold{width:min(66vw,250px);aspect-ratio:5/7;border-radius:24px;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer}
.hold .face{position:absolute;inset:0;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;box-sizing:border-box;backface-visibility:hidden;transition:transform .35s cubic-bezier(.3,1.2,.5,1)}
.hold .back{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.6);color:#fff}
.hold .back .q{font-family:var(--display);font-weight:800;font-size:70px;line-height:1;opacity:.9}
.hold .back small{font-weight:700;font-size:14px;opacity:.85}
.hold .front{background:#fff;color:var(--ink);transform:rotateY(180deg)}
.hold.show .back{transform:rotateY(-180deg)}
.hold.show .front{transform:rotateY(0)}
.cardface .cn{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,36px);line-height:1;letter-spacing:-.02em}
.cardface .ct{font-size:15px;font-weight:700;color:var(--ink-soft);line-height:1.35}
.cardface .none{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05}

/* Game */
.top{display:flex;align-items:center;gap:12px}
.top .who{flex:1;min-width:0}
.top .name{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,36px);line-height:1;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .icons{display:flex;gap:6px}
.redirect{display:flex;align-items:center;gap:8px;align-self:center;background:rgba(0,0,0,.2);border-radius:999px;padding:4px 14px 4px 4px;font-weight:800;font-size:13px;max-width:100%}
.redirect .av{box-shadow:none}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:4px}
.die{width:104px;height:104px;border-radius:28px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:17px;box-sizing:border-box;gap:5px;box-shadow:0 10px 0 rgba(0,0,0,.16),0 18px 30px rgba(0,0,0,.18);flex:none}
.die .pip{border-radius:50%;margin:2px}
.die .pip.on{background:var(--pc);transition:background-color .5s}
.die.idle{cursor:pointer;animation:breathe 2.4s ease-in-out infinite}
.die.rolling{animation:tumble .7s cubic-bezier(.3,.7,.35,1)}
.die.teeter{animation:teeter .42s ease-in-out infinite}
.die.tip{animation:tip .3s ease-in both}
@keyframes breathe{50%{transform:translateY(-5px) rotate(-3deg)}}
@keyframes tumble{0%{transform:none}25%{transform:translateY(-44px) rotate(-150deg) scale(.86)}55%{transform:translateY(-8px) rotate(-290deg) scale(1.04)}75%{transform:translateY(-16px) rotate(-345deg)}100%{transform:rotate(-360deg)}}
@keyframes teeter{0%,100%{transform:rotate(-7deg) translateY(-2px)}50%{transform:rotate(9deg) translateY(-6px)}}
@keyframes tip{0%{transform:rotate(9deg)}100%{transform:rotate(95deg) translateY(-6px) scale(.9)}}
.verdict{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px;justify-content:center;max-width:100%}
.verdict .word{font-family:var(--display);font-weight:800;font-size:clamp(46px,14vw,66px);line-height:.9;letter-spacing:-.03em;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.verdict .line{font-weight:700;font-size:16px;color:var(--soft)}
.verdict .whobar{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.streak{background:#fff;color:var(--pc);font-weight:800;font-size:13px;border-radius:999px;padding:4px 12px;animation:pop .45s cubic-bezier(.2,1.6,.4,1) .1s both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.actions{width:100%;display:flex;flex-direction:column;gap:10px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px 6px;width:100%}
.pk{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pk span{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk:active .av{transform:scale(.94)}
.pk.off{opacity:.35;pointer-events:none}
.allrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-bottom:8px}
.allrow .x{position:relative}
.allrow .x.saved .av{opacity:.35}
.allrow .x.saved::after{content:"gerettet";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-size:10px;font-weight:800;background:#fff;color:var(--konter);border-radius:999px;padding:0 5px}
.strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 2px;margin:0 -2px}
.strip::-webkit-scrollbar{display:none}
.pl{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pl .av{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.pl.cur .av{box-shadow:0 0 0 3px #fff}
.pl .wrap{position:relative}
.pl .badge{position:absolute;right:-6px;bottom:-4px;min-width:22px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:#fff;color:var(--ink);font-weight:800;font-size:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pl .cardic{position:absolute;left:-5px;top:-4px;width:14px;height:19px;border-radius:3px;background:#fff;box-shadow:0 0 0 1.5px var(--pc), 2px 2px 0 rgba(0,0,0,.2)}
.pl .cardic::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--pc)}
.pl .nm{font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .hearts{font-size:10px;letter-spacing:1px;line-height:1;color:#fff}
.pl .hearts i{font-style:normal;opacity:.3}
.pl.out{opacity:.45}
.pl.out .av{filter:grayscale(1)}
.pl.koed{opacity:.6}
.flash{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0;z-index:5}
.flash.on{animation:flash .6s ease}
@keyframes flash{25%{opacity:.22}}

/* FX overlays */
.fx{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;color:#fff;background:rgba(10,11,16,.72);padding:24px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px));box-sizing:border-box;animation:fadeIn .2s ease both;cursor:pointer}
@keyframes fadeIn{from{opacity:0}}
.fx .big{font-family:var(--display);font-weight:800;font-size:clamp(54px,17vw,96px);line-height:.9;letter-spacing:-.03em;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.fx .sub{font-weight:800;font-size:18px;opacity:.9}
.fx .skip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom, 0px));font-size:12px;opacity:.6;font-weight:700}
.fx .show{width:min(70vw,280px);aspect-ratio:1;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.1);display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.fx .show img{width:100%;height:100%;object-fit:cover;display:block}
.fx .show .ini{font-family:var(--display);font-weight:800;font-size:110px}
.fx .cap{font-weight:800;font-size:20px}
.fx .bigcard{width:min(62vw,240px);aspect-ratio:5/7;border-radius:24px;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;box-sizing:border-box;animation:flipIn .6s cubic-bezier(.2,1.2,.4,1) both;box-shadow:0 20px 60px rgba(0,0,0,.45)}
@keyframes flipIn{from{transform:perspective(800px) rotateY(180deg) scale(.6);opacity:0}}
.fx .who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.fx .spinname{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,64px);line-height:1}
.fx.win{background:var(--ink)}
.fx .crown{font-family:var(--display);font-weight:800;letter-spacing:.2em;font-size:14px;text-transform:uppercase;color:var(--drink)}

function dropPhoto(id){ delete photos[id]; LS.del("tw_ph_" + id); }
function photoIds(){
  const ids = state.players.map(p => p.photo).filter(Boolean);
  state.proofs.forEach(x => { ids.push(x.photo); (x.frames || []).forEach(f => ids.push(f)); });
  return ids;
}
function loadPhotos(){ photoIds().forEach(id => { if (!photos[id]){ const d = LS.get("tw_ph_" + id); if (d) photos[id] = d; } }); }
function pushUndo(){ undoStack.push(JSON.stringify(state)); if (undoStack.length > 50) undoStack.shift(); }
const emit = fx => fxQ.push(fx);

const P = id => state.players.find(p => p.id === id);
const cur = () => state.players[state.turn];
const active = () => state.players.filter(p => p.active);
const tot = p => p.drinks + p.extras;
const colorOf = p => PALETTE[(p ? p.color : 0) % PALETTE.length];
const others = id => active().filter(p => p.id !== id);
function nextIndex(from){
  const n = state.players.length;
  for (let k = 1; k <= n; k++){ const i = (from + k) % n; if (state.players[i].active) return i; }
  return -1;
}
const nobodyAfter = i => !state.players.slice(i + 1).some(p => p.active);
const glassLabel = i => { const g = state.glasses[i]; return TYPES[g.type] + (g.content ? " · " + g.content : ""); };
function log(e){ state.history.push(Object.assign({ t:Date.now() }, e)); if (state.history.length > 400) state.history.shift(); }
function rage(score, pid, text){ if (!state.rage || score >= state.rage.score) state.rage = { score, pid, text, t:Date.now() }; }

/* =====================================================================
   SPIEL-ENGINE (ohne DOM)
   ===================================================================== */
function dealCard(){
  if (!state.settings.cards) return null;
  if (rndInt(3) === 0) return null;          // etwa ein Drittel ohne Karte
  if (!state.deck.length) state.deck = shuffle(Object.keys(CARDS));
  return state.deck.pop();
}
function makePlayer(name, photoId){
  const used = new Set(state.players.map(p => p.color));
  let color = state.players.length; for (let c = 0; c < PALETTE.length; c++) if (!used.has(c)){ color = c; break; }
  return { id:uid(), name:String(name).trim().slice(0,18), photo:photoId || null, color, active:true, ko:false, koAt:0,
    hearts:state.settings.hearts, drinks:0, shots:0, extras:0, streak:0, best:0,
    card:dealCard(), cardUsed:false, jokerUsed:false, konters:0, drillings:0, nearLast:0, nearRefill:0 };
}

function eStartJoin(){
  const keepPrefs = { settings:state.settings, config:state.config };
  state = fresh(); state.settings = keepPrefs.settings; state.config = keepPrefs.config;
  state.glasses = JSON.parse(JSON.stringify(state.config));
  state.phase = "join"; state.joining = true; undoStack = [];
}
function eJoin(name, photoId){
  if (!String(name || "").trim()) return null;
  pushUndo();
  const p = makePlayer(name, photoId);
  state.players.push(p); state.turn = state.players.length - 1;
  state.handedFrom = null; state.steps = []; state.after = null;
  if (state.settings.cards){ state.peekQueue = [p.id]; state.peekReturn = "game"; state.phase = "peek"; }
  else state.phase = "game";
  return p;
}
function ePeekDone(){
  state.peekQueue.shift();
  if (!state.peekQueue.length) state.phase = state.peekReturn || "game";
}
function eAllIn(){
  if (state.players.length < 2 || state.phase !== "join") return false;
  pushUndo();
  state.joining = false; state.phase = "game"; state.handedFrom = null; state.steps = []; state.after = null; state.bag = [];
  if (state.settings.order === "circle"){ const fi = state.players.findIndex(p => p.active); state.turn = fi < 0 ? 0 : fi; }
  else { const ni = pickRandom(null); if (ni >= 0){ state.turn = ni; state.spin = { id:state.players[ni].id, slow:false }; } }
  finish();
  return true;
}
function pickRandom(prevId){
  const alive = active(); if (!alive.length) return -1;
  let id;
  if (state.settings.order === "chaos") id = alive[rndInt(alive.length)].id;
  else {
    state.bag = state.bag.filter(x => { const q = P(x); return q && q.active; });
    if (!state.bag.length) state.bag = alive.map(q => q.id);
    let cand = state.bag.filter(x => x !== prevId); if (!cand.length) cand = state.bag.slice();
    id = cand[rndInt(cand.length)];
    state.bag.splice(state.bag.indexOf(id), 1);
  }
  return state.players.findIndex(q => q.id === id);
}
function nextTurn(){
  const p = cur(); state.handedFrom = p ? p.id : null;
  if (state.joining && nobodyAfter(state.turn)){ state.phase = "join"; return; }
  const ord = state.joining ? "circle" : state.settings.order;
  const ni = ord === "circle" ? nextIndex(state.turn) : pickRandom(p ? p.id : null);
  if (ni >= 0){
    state.turn = ni;
    if (ord !== "circle") state.spin = { id:state.players[ni].id, slow: state.full.filter(Boolean).length >= 5 };
  }
}
function decideWinner(){
  const alive = active(); let w;
  if (alive.length === 1) w = [alive[0].id];
  else {
    const last = Math.max(0, ...state.players.map(p => p.koAt || 0));
    const c = state.players.filter(p => (p.koAt || 0) === last);
    const min = Math.min(...c.map(tot));
    w = c.filter(p => tot(p) === min).map(p => p.id);
  }
  state.winners = w; eEnd();
}
function prune(){
  // Auswahl ohne mögliches Ziel (z. B. alle anderen ausgestiegen) überspringen
  while (state.steps[0] && state.steps[0].t === "pick" && state.steps[0].purpose !== "sabotage" && state.steps[0].purpose !== "tausch" && !pickTargets(state.steps[0]).length){
    const s = state.steps.shift();
    if (s.purpose === "joker"){ const by = P(s.by); if (by) by.jokerUsed = false; }
  }
  if (state.steps[0] && state.steps[0].t === "pick" && state.steps[0].purpose === "sabotage" && !state.full.some(f => !f)) state.steps.shift();
}
function finish(){
  prune();
  if (state.steps.length || state.phase !== "game") return;
  if (state.settings.ko && !state.joining && state.players.length >= 2 && active().length <= 1){ decideWinner(); return; }
  if (!active().length){ if (!state.joining) eEnd(); else state.phase = "join"; return; }
  const p = cur();
  if (state.after === "again" && p && p.active){ state.after = null; return; }
  if (state.after === "pass" || !p || !p.active){ state.after = null; if (p) p.streak = 0; nextTurn(); }
}
function knockOut(p, cause){
  p.ko = true; p.active = false; p.koAt = state.eventId; p.streak = 0; p.hearts = 0;
  log({ kind:"ko", pid:p.id, via:cause });
  if (cause === "doppel" || cause === "drilling") rage(6, p.id, `${p.name}. Raus durch ${cause === "doppel" ? "ein Doppel" : "einen Drilling"}. Mit dem letzten Herz.`);
  if (state.redirect && (state.redirect.target === p.id)) state.redirect = null;
  state.bag = state.bag.filter(id => id !== p.id);
  state.steps = state.steps.filter(s => !(s.t === "drink" && s.who === p.id) && !(s.t === "pick" && s.by === p.id && s.purpose !== "duell"));
  if (cur() && cur().id === p.id) state.after = "pass";
  return [{ t:"ko", who:p.id, voluntary: cause === "leave" }];
}
function hurt(p, n, cause){
  if (!state.settings.ko || p.ko) return [];
  p.hearts = Math.max(0, p.hearts - n);
  return p.hearts > 0 ? [] : knockOut(p, cause);
}
function checkFullHouse(){
  if (!state.settings.addons.full || !state.full.every(Boolean)) return;
  state.steps.unshift({ t:"allDrink", excused:[], key:uid() });
  emit({ type:"fullhouse" }); log({ kind:"fullhouse" });
}
function setFill(i, pid, sabotage){
  state.full[i] = true;
  state.lastFill = { glass:i, pid, rollId:state.rollId, t:Date.now(), sabotage:!!sabotage };
}

function eRoll(n){
  if (state.phase !== "game" || state.steps.length || !cur() || !cur().active) return false;
  n = Math.max(1, Math.min(6, n | 0));
  pushUndo();
  const p = cur(); const i = n - 1;
  state.rollId++; state.lastRoll = n;
  state.rolls.push(n); if (state.rolls.length > 12) state.rolls.shift();
  const fullCount = state.full.filter(Boolean).length;
  log({ kind:"roll", pid:p.id, roll:n });
  if (state.full[i]){
    if (fullCount === 1){ p.nearLast++; rage(2, p.id, `${p.name}. Glas ${n}. Das einzige volle Glas auf dem Tisch.`); }
    const lf = state.lastFill;
    if (lf && lf.glass === i && lf.rollId === state.rollId - 1 && lf.pid !== p.id){
      p.nearRefill++;
      const f = P(lf.pid); const sec = Math.max(1, Math.round((Date.now() - lf.t) / 1000));
      rage(lf.sabotage ? 4 : 3, p.id, `${p.name}. Glas ${n}. ${sec} Sekunden, nachdem ${f ? f.name : "jemand"} es ${lf.sabotage ? "sabotiert" : "gefüllt"} hat.`);
    }
    let who = p.id, from = null, via = null;
    const r = state.redirect;
    if (r){ const t = P(r.target); if (t && t.active){ who = t.id; from = r.from; via = r.src; } state.redirect = null; }
    state.steps.push({ t:"drink", who, from, via, glass:i, main:true, key:uid() });
    state.after = "again";
  } else {
    state.steps.push({ t:"fill", glass:i, main:true });
    state.after = "pass";
  }
  let run = 1; for (let k = state.rolls.length - 2; k >= 0 && state.rolls[k] === n; k--) run++;
  const A = state.settings.addons;
  if (run >= 3 && A.drilling){ p.drillings++; state.steps.push({ t:"drink", who:p.id, kurz:true, via:"drilling", key:uid() }); emit({ type:"banner", text:"Drilling!", sub:`Dreimal die ${n}. Kurzer für ${p.name}.` }); log({ kind:"drilling", pid:p.id, roll:n }); }
  else if (run >= 2 && A.doppel){ state.steps.push({ t:"drink", who:p.id, kurz:true, via:"doppel", key:uid() }); emit({ type:"banner", text:"Doppel!", sub:`Zweimal die ${n}. Kurzer für ${p.name}.` }); log({ kind:"doppel", pid:p.id, roll:n }); }
  return true;
}

function eConfirm(){
  const s = state.steps[0]; if (!s || s.t === "pick") return false;
  pushUndo(); state.eventId++;
  const p = cur();
  if (s.t === "fill"){
    setFill(s.glass, p.id, false); p.streak = 0;
    log({ kind:"fill", pid:p.id, roll:s.glass + 1 });
    state.steps.shift();
    checkFullHouse();
  } else if (s.t === "drink"){
    const d = P(s.who); state.steps.shift();
    const front = [];
    if (d){
      if (s.kurz){
        d.extras++;
        log({ kind:"kurz", pid:d.id, via:s.via, from:s.from });
        front.push(...hurt(d, 1, s.via));
      } else {
        const g = state.glasses[s.glass]; state.full[s.glass] = false;
        d.drinks++; if (g.type === "shot") d.shots++;
        log({ kind:"drink", pid:d.id, roll:s.glass + 1, label:glassLabel(s.glass), via:s.via, from:s.from });
        const own = p && d.id === p.id && !s.from;
        if (own){
          p.streak++; p.best = Math.max(p.best, p.streak);
          if (p.streak >= 4) rage(2 + p.streak, p.id, `${p.name}. ${p.streak} Gläser am Stück.`);
          if (p.streak >= 3) emit({ type:"serie", pid:p.id, n:p.streak });
        }
        front.push(...hurt(d, g.type === "shot" ? 2 : 1, "glass"));
        if (g.type === "shot" && state.settings.addons.duell && others(d.id).length) front.push({ t:"pick", purpose:"duell", by:d.id });
        if (own && state.settings.addons.rache && p.active && p.streak > 0 && p.streak % 3 === 0 && others(p.id).length) front.push({ t:"pick", purpose:"rache", by:p.id });
      }
    }
    state.steps.unshift(...front);
  } else if (s.t === "allDrink"){
    state.steps.shift(); const front = [];
    active().forEach(q => { if (!s.excused.includes(q.id)){ q.extras++; front.push(...hurt(q, 1, "full")); } });
    log({ kind:"allDrink", excused:s.excused.slice() });
    state.steps.unshift(...front);
  } else {
    state.steps.shift();
  }
  finish();
  return true;
}

function canJoker(){
  const s = state.steps[0]; const p = cur();
  return !!(s && s.t === "drink" && s.main && p && s.who === p.id && !s.from && state.settings.addons.joker && !p.jokerUsed && others(p.id).length);
}
function eJoker(){
  if (!canJoker()) return false;
  pushUndo(); const p = cur(); p.jokerUsed = true;
  state.steps.unshift({ t:"pick", purpose:"joker", by:p.id });
  return true;
}

function ePlayCard(){
  const p = cur(); if (!p || state.phase !== "game") return "ctx";
  const s = state.steps[0];
  const ctx = !s || (s.t === "fill" && s.main) || s.t === "pass";
  if (!ctx) return "ctx";
  if (!state.settings.cards || !p.card || p.cardUsed) return "none";
  if (CARDS[p.card].kind !== "attack") return "mismatch";
  const fillIdx = s && s.t === "fill" ? s.glass : -1;
  if (p.card === "sabotage" && !state.full.some((f, i) => !f && i !== fillIdx)) return "mismatch";
  if ((p.card === "umleitung" || p.card === "barkeeper") && !others(p.id).length) return "mismatch";
  pushUndo();
  if (s && s.t === "fill"){
    setFill(s.glass, p.id, false); p.streak = 0;
    log({ kind:"fill", pid:p.id, roll:s.glass + 1 });
    state.steps.shift(); state.steps.push({ t:"pass" });
  }
  p.cardUsed = true;
  log({ kind:"card", pid:p.id, card:p.card });
  emit({ type:"card", pid:p.id, card:p.card });
  state.steps.unshift({ t:"pick", purpose:p.card, by:p.id });
  if (fillIdx >= 0) checkFullHouse();
  return "ok";
}

function pickTargets(s){
  if (!s || s.t !== "pick") return [];
  if (s.purpose === "engel"){ const a = state.steps[1]; return others(s.by).filter(q => !(a && a.excused && a.excused.includes(q.id))); }
  return others(s.by);
}
function ePickPlayer(tid){
  const s = state.steps[0]; if (!s || s.t !== "pick" || s.purpose === "sabotage" || s.purpose === "tausch") return false;
  if (!pickTargets(s).some(q => q.id === tid)) return false;
  pushUndo(); state.steps.shift();
  const by = P(s.by), t = P(tid);
  switch (s.purpose){
    case "duell": case "barkeeper":
      state.steps.unshift({ t:"drink", who:tid, from:s.by, via:s.purpose, kurz:true, key:uid() });
      log({ kind:"target", pid:s.by, target:tid, via:s.purpose });
      break;
    case "rache": case "umleitung":
      state.redirect = { target:tid, from:s.by, src:s.purpose };
      log({ kind:"target", pid:s.by, target:tid, via:s.purpose });
      emit({ type:"banner", text: s.purpose === "rache" ? "Rache!" : "Umleitung!", sub:`Das nächste volle Glas trinkt ${t.name}.` });
      break;
    case "joker": {
      const d = state.steps[0];
      if (d && d.t === "drink"){ d.who = tid; d.from = s.by; d.via = "joker"; }
      log({ kind:"target", pid:s.by, target:tid, via:"joker" });
      emit({ type:"banner", text:"Joker!", sub:`${by.name} gibt das Glas an ${t.name}.` });
      break;
    }
    case "engel": {
      const d = state.steps[0];
      if (d && d.t === "allDrink") d.excused.push(tid);
      log({ kind:"saved", pid:s.by, target:tid });
      break;
    }
  }
  finish();
  return true;
}
function ePickGlass(i){
  const s = state.steps[0]; if (!s || s.t !== "pick") return false;
  if (s.purpose === "sabotage"){
    if (state.full[i]) return false;
    pushUndo(); setFill(i, s.by, true);
    log({ kind:"sabotage", pid:s.by, roll:i + 1 });
    state.steps.shift(); checkFullHouse(); finish();
    return true;
  }
  if (s.purpose === "tausch"){
    if (s.first == null || s.first === i){ s.first = s.first === i ? null : i; return true; }
    pushUndo();
    const a = s.first, b = i;
    [state.glasses[a], state.glasses[b]] = [state.glasses[b], state.glasses[a]];
    [state.full[a], state.full[b]] = [state.full[b], state.full[a]];
    if (state.lastFill){ if (state.lastFill.glass === a) state.lastFill.glass = b; else if (state.lastFill.glass === b) state.lastFill.glass = a; }
    log({ kind:"tausch", pid:s.by, a:a + 1, b:b + 1 });
    state.steps.shift(); finish();
    return true;
  }
  return false;
}

function eKonter(pid){
  const s = state.steps[0]; if (!s || (s.t !== "drink" && s.t !== "allDrink")) return "ctx";
  const p = P(pid); if (!p || !p.active) return "none";
  if (!state.settings.cards || !p.card || p.cardUsed) return "none";
  const c = p.card; let ok = false;
  if (c === "glueckspilz") ok = s.t === "drink" ? s.who === pid : !s.excused.includes(pid);
  else if (c === "spiegel") ok = s.t === "drink" && s.who === pid && !!s.from && s.from !== pid && !!P(s.from) && P(s.from).active;
  else if (c === "schutzengel") ok = s.t === "drink" ? s.who !== pid : active().some(q => q.id !== pid && !s.excused.includes(q.id));
  if (!ok) return "mismatch";
  pushUndo(); p.cardUsed = true; p.konters++;
  const target = s.t === "drink" ? (c === "spiegel" ? s.from : s.who) : null;
  log({ kind:"konter", pid, card:c, target });
  emit({ type:"card", pid, card:c, target });
  if (c === "spiegel"){
    const att = P(s.from);
    rage(4, att.id, `${att.name}. Vom eigenen ${VIA[s.via] || "Angriff"} getroffen. Spiegel von ${p.name}.`);
    s.who = s.from; s.from = pid; s.via = "spiegel";
  } else if (s.t === "allDrink"){
    if (c === "glueckspilz") s.excused.push(pid);
    else state.steps.unshift({ t:"pick", purpose:"engel", by:pid });
  } else {
    state.steps.shift();
    if (s.main) state.after = "pass";
    finish();
  }
  return "ok";
}

function eLeave(id){
  const idx = state.players.findIndex(p => p.id === id); const p = state.players[idx];
  if (!p || !p.active) return false;
  pushUndo(); state.eventId++;
  let front = [];
  if (state.settings.ko) front = knockOut(p, "leave");
  else {
    p.active = false; p.streak = 0; log({ kind:"leave", pid:id });
    if (state.redirect && state.redirect.target === id) state.redirect = null;
    state.bag = state.bag.filter(x => x !== id);
    state.steps = state.steps.filter(s => !(s.t === "drink" && s.who === id) && !(s.t === "pick" && s.by === id));
  }
  if (idx === state.turn){ state.steps = []; state.after = "pass"; }
  if (state.phase === "game"){ state.steps.unshift(...front); finish(); }
  if (state.phase === "game" && !active().length && !state.joining) eEnd();
  return true;
}
function eRejoin(id){
  const p = P(id); if (!p || p.active || p.ko) return false;
  pushUndo(); p.active = true; log({ kind:"rejoin", pid:id });
  if (!cur() || !cur().active) state.turn = state.players.indexOf(p);
  return true;
}
function eAdd(name, photoId){
  if (!String(name || "").trim()) return null;
  pushUndo();
  const p = makePlayer(name, photoId);
  state.players.splice(state.turn + 1, 0, p);
  log({ kind:"add", pid:p.id });
  if (state.settings.cards && state.phase === "game"){ state.peekQueue = [p.id]; state.peekReturn = "game"; state.phase = "peek"; }
  return p;
}
function eEnd(){ state.phase = "end"; state.steps = []; state.after = null; state.joining = false; state.redirect = null; state.recapPending = true; }
function eRematch(){
  state.players.forEach(p => Object.assign(p, { active:true, ko:false, koAt:0, hearts:state.settings.hearts, drinks:0, shots:0, extras:0, streak:0, best:0,
    card:null, cardUsed:false, jokerUsed:false, konters:0, drillings:0, nearLast:0, nearRefill:0 }));
  state.deck = []; state.players.forEach(p => { p.card = dealCard(); });
  Object.assign(state, { glasses:JSON.parse(JSON.stringify(state.config)), full:[false,false,false,false,false,false], steps:[], after:null, redirect:null,
    rolls:[], history:[], proofs:[], rage:null, winners:null, lastFill:null, bag:[], joining:false, recapPending:false, handedFrom:null });
  undoStack = [];
  if (state.settings.order === "circle") state.turn = 0;
  else { const ni = pickRandom(null); state.turn = ni < 0 ? 0 : ni; state.spin = { id:state.players[state.turn].id, slow:false }; }
  if (state.settings.cards){ state.peekQueue = state.players.map(p => p.id); state.peekReturn = "game"; state.phase = "peek"; }
  else state.phase = "game";
}

const app = document.getElementById("app");
const sheetRoot = document.getElementById("sheet-root");
const fxRoot = document.getElementById("fx-root");
let headless = false;

function act(fn){
  const r = fn();
  save();
  if (!headless){ render(); pumpFx(); }
  return r;
}
function toast(t){
  if (headless) return;
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast" role="status">${esc(t)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => { root.innerHTML = ""; }, 2200);
}

/* ---- Fotos ---- */
function pickPhoto(front, opts){
  return new Promise(resolve => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.setAttribute("capture", front ? "user" : "environment");
    inp.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(inp);
    inp.addEventListener("change", () => {
      const f = inp.files && inp.files[0]; inp.remove();
      if (!f) return resolve(null);
      const url = URL.createObjectURL(f); const img = new Image();
      img.onload = () => { const d = shrink(img, opts); URL.revokeObjectURL(url); resolve(d); };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    }, { once:true });
    inp.click();
  });
}
function shrink(src, opts){
  try {
    const w0 = src.videoWidth || src.naturalWidth, h0 = src.videoHeight || src.naturalHeight;
    const c = document.createElement("canvas"); const ctx = c.getContext("2d");
    if (opts.square){
      const s = Math.min(w0, h0); c.width = c.height = opts.max;
      ctx.drawImage(src, (w0 - s) / 2, (h0 - s) / 2, s, s, 0, 0, opts.max, opts.max);
    } else {
      const sc = Math.min(1, opts.max / Math.max(w0, h0));
      c.width = Math.round(w0 * sc); c.height = Math.round(h0 * sc);
      ctx.drawImage(src, 0, 0, c.width, c.height);
    }
    return c.toDataURL("image/jpeg", opts.q || 0.74);
  } catch(e){ return null; }
}

/* Boomerang-Animation: alle Bilder mit data-boom laufen 1-2-3-4-3-2 */
const BOOM = [0,1,2,3,2,1]; let boomTick = 0;
setInterval(() => {

/* Prüft, ob der Inhalt in der Mitte Platz hat, und verkleinert sonst schrittweise */
function fitStage(){
  const st = app.querySelector(".stage"); if (!st) return;
  app.classList.remove("tight", "tighter", "tightest");
  const over = () => {
    const kids = [...st.children];
    const cs = getComputedStyle(st);
    const avail = st.clientHeight - parseFloat(cs.paddingTop || 0) - parseFloat(cs.paddingBottom || 0);
    const need = kids.reduce((s, c) => s + (parseFloat(getComputedStyle(c).height) || c.offsetHeight), 0) + Math.max(0, kids.length - 1) * parseFloat(cs.rowGap || 0);
    return need > avail - 2 || kids.some(c => c.scrollHeight > c.offsetHeight + 1);
  };
  if (over()){ app.classList.add("tight"); if (over()){ app.classList.add("tighter"); if (over()) app.classList.add("tightest"); } }
}

function awards(){
  const ps = state.players; if (!ps.length) return [];
  const by = f => ps.slice().sort((a,b) => f(b) - f(a))[0];
  const out = [];
  const top = by(p => tot(p) * 10 + p.shots);
  if (tot(top)) out.push(["Meiste Getränke", top, tot(top)]);
  const sh = by(p => p.shots); if (sh.shots) out.push(["Meiste Shots", sh, sh.shots]);

/* ---- Effekte (Overlays) ---- */
let fxBusy = false;
function pumpFx(){
  if (state.spin){ fxQ.push({ type:"spin", id:state.spin.id, slow:state.spin.slow }); state.spin = null; save(); }
  if (state.phase === "end" && state.recapPending){ fxQ.push({ type:"recap" }); state.recapPending = false; save(); }
  if (fxBusy || !fxQ.length || headless) return;
  showFx(fxQ.shift());
}
function fxDone(){ fxRoot.innerHTML = ""; fxBusy = false; clearTimeout(fxDone._t); (fxDone._iv || []).forEach(clearInterval); fxDone._iv = []; pumpFx(); }
function fxShell(html, ms, cls){
  fxBusy = true;
  fxRoot.innerHTML = `<div class="fx ${cls || ""}" data-act="fx-skip">${html}<span class="skip">Tippen zum Überspringen</span></div>`;
  clearTimeout(fxDone._t); if (ms) fxDone._t = setTimeout(fxDone, ms);
}
function slideFrames(p){ return p && p.photo && photos[p.photo] ? `<img src="${photos[p.photo]}" alt="">` : `<span class="ini" style="color:${colorOf(p)}">${esc(((p && p.name) || "?").charAt(0).toUpperCase())}</span>`; }

  if (!f) return;

    fxShell(`<div class="big">${esc(f.text)}</div><div class="sub">${esc(f.sub || "")}</div>`, 1500);
    buzz([60,40,60]);
  } else if (f.type === "card"){
    const p = P(f.pid); const c = CARDS[f.card]; const t = f.target && P(f.target);
    fxShell(`<div class="who">${avatar(p,"s")}${esc(p ? p.name : "")} spielt</div>
      <div class="bigcard cardface"><span class="tag ${c.kind}">${c.kind === "attack" ? "Angriff" : "Konter"}</span><span class="cn">${c.name}</span><span class="ct">${c.text}</span></div>
      ${t ? `<div class="sub">${f.card === "spiegel" ? "zurück an " : "für "}${esc(t.name)}</div>` : ""}`, 2300);
    buzz([40,30,90]);
  } else if (f.type === "fullhouse"){
    const ps = active();
    fxShell(`<div class="show" id="fx-show">${slideFrames(ps[0])}</div><div class="big">Alle trinken!</div><div class="sub">Volles Haus · jeder einen Kurzen</div>`, 2600);
    let k = 0; const el = document.getElementById("fx-show");
    fxDone._iv.push(setInterval(() => { k++; if (el && ps.length) el.innerHTML = slideFrames(ps[k % ps.length]); }, 150));
    buzz([100,60,100,60,160]);
  } else if (f.type === "serie"){
    const p = P(f.pid); const pr = state.proofs.filter(x => x.pid === f.pid && photos[x.photo]);
    if (!pr.length){ fxShell(`<div class="who">${avatar(p,"m")}</div><div class="big">${f.n} am Stück!</div><div class="sub">${esc(p ? p.name : "")}, schon wieder.</div>`, 1600); return; }
    fxShell(`<div class="show" id="fx-show">${proofImg(pr[0])}</div><div class="big">${f.n} am Stück!</div><div class="sub">${esc(p.name)}, schon wieder.</div>`, 2400);
    let k = 0; const el = document.getElementById("fx-show");
    fxDone._iv.push(setInterval(() => { k++; if (el) el.innerHTML = proofImg(pr[k % pr.length]); }, 600));
  } else if (f.type === "spin"){
    const ps = active(); const target = P(f.id);
    if (!target || ps.length < 2){ fxDone(); return; }
    fxShell(`<div class="eyebrow" style="color:rgba(255,255,255,.75)">Wer ist dran?</div><div class="show" id="fx-show">${slideFrames(ps[0])}</div><div class="spinname" id="fx-name">${esc(ps[0].name)}</div>`, 0);
    const el = document.getElementById("fx-show"), nm = document.getElementById("fx-name");
    const total = f.slow ? 22 : 15; let k = rndInt(ps.length), step = 0;
    const tick = () => {
      if (!fxBusy) return;
      step++;
      const q = step >= total ? target : ps[k++ % ps.length];
      if (el) el.innerHTML = slideFrames(q); if (nm) nm.textContent = q.name;
      if (step >= total){ if (nm) nm.textContent = q.name + " ist dran!"; buzz(50); fxDone._t = setTimeout(fxDone, 1100); return; }
      const dly = 60 + Math.pow(step / total, 3) * (f.slow ? 520 : 300);
      fxDone._t = setTimeout(tick, dly);
    };
    fxDone._t = setTimeout(tick, 80);
  } else if (f.type === "recap"){
    const slides = [];
    state.proofs.filter(x => photos[x.photo]).forEach(x => { const q = P(x.pid); slides.push(`<div class="eyebrow" style="color:rgba(255,255,255,.75)">Rückblick</div><div class="show">${proofImg(x)}</div><div class="cap">${esc(q ? q.name : "Alle")}</div><div class="sub">${esc(x.label)}</div>`); });
    if (state.settings.cards) state.players.forEach(q => { const c = q.card && CARDS[q.card];
      slides.push(`<div class="eyebrow" style="color:rgba(255,255,255,.75)">Die Karten</div><div class="who">${avatar(q,"m")}${esc(q.name)}</div>${c ? `<div class="bigcard cardface"><span class="tag ${c.kind}">${c.kind === "attack" ? "Angriff" : "Konter"}</span><span class="cn">${c.name}</span><span class="ct">${q.cardUsed ? "gespielt" : "nie gespielt"}</span></div>` : `<div class="big" style="font-size:40px">Keine Karte</div><div class="sub">Hat geblufft.</div>`}`); });
    const W = (state.winners || []).map(P).filter(Boolean);
    if (W.length) slides.push(`<span class="crown">Last Man Standing</span><div class="who" style="gap:14px">${W.map(p => avatar(p,"l")).join("")}</div><div class="big" style="font-size:clamp(40px,12vw,72px)">${W.map(p => esc(p.name)).join(" & ")}</div>`);
    if (!slides.length){ fxDone(); return; }
    let k = 0;
    const show = () => {
      if (k >= slides.length){ fxDone(); return; }
      const last = W.length && k === slides.length - 1;
      fxShell(slides[k], 0, last ? "win" : ""); k++;
      fxDone._t = setTimeout(show, last ? 3200 : 1500);
    };
    fxBusy = true; show();
    fxRoot.dataset.recap = "1";
  } else fxDone();
}

/* ---- Würfeln mit Fake-Spannung ---- */
function doRoll(){
  if (rolling || state.phase !== "game" || state.steps.length || fxBusy) return;
  rolling = true;
  const n = rnd6();
  const fullNow = state.full.slice();
  let tease = 0;
  if (!reduced && rndInt(100) < 22){
    if (fullNow[n - 1]){ const e = [0,1,2,3,4,5].filter(i => !fullNow[i]); if (e.length) tease = e[rndInt(e.length)] + 1; }
    else { const f = [0,1,2,3,4,5].filter(i => fullNow[i]); if (f.length){ const sh = f.filter(i => state.glasses[i].type === "shot"); const pool = sh.length ? sh : f; tease = pool[rndInt(pool.length)] + 1; } }
  }
  const die = document.getElementById("die");
  const done = () => {
    rolling = false;
    act(() => eRoll(n));
    const s = state.steps[0];
    if (s && s.t === "drink"){ buzz([90,60,90]); const f = document.getElementById("flash"); f.classList.remove("on"); void f.offsetWidth; f.classList.add("on"); }
    else buzz(25);
  };
  if (!die || reduced){ done(); return; }
  die.classList.remove("idle"); die.classList.add("rolling");
  let k = 0;
  const iv = setInterval(() => { k = (k + 1 + rndInt(5)) % 6; die.innerHTML = dieFace(k + 1); }, 70);
  if (!tease){
    setTimeout(() => { clearInterval(iv); die.innerHTML = dieFace(n); }, 620);
    setTimeout(done, 720);
  } else {
    const gEl = () => document.querySelector(`.g[data-i="${tease - 1}"]`);
    setTimeout(() => { clearInterval(iv); die.classList.remove("rolling"); die.innerHTML = dieFace(tease); die.classList.add("teeter"); const g = gEl(); g && g.classList.add("tease"); }, 620);
    setTimeout(() => { die.classList.remove("teeter"); die.classList.add("tip"); }, 1520);
    setTimeout(() => { die.classList.remove("tip"); die.innerHTML = dieFace(n); const g = gEl(); g && g.classList.remove("tease"); }, 1800);
    setTimeout(done, 1950);
  }
}

let camStream = null, camFacing = "environment";
function proofContext(){

  return { key:s.key, pid: s.t === "drink" ? s.who : null, label: s.t === "allDrink" ? "Volles Haus" : (s.kurz ? "Kurzer · " + (VIA[s.via] || "") : "Glas " + (s.glass + 1) + " · " + glassLabel(s.glass)) };
}
function addProof(ctx, frames){
  const ids = frames.map(d => { const id = "pr_" + uid(); savePhoto(id, d); return id; });

async function takeProof(){

  const d = await pickPhoto(false, { max:720, square:false }); if (d) addProof(ctx, [d]);
}
function closeCam(){ if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } document.getElementById("cam-root") && document.getElementById("cam-root").remove(); }
async function openCam(ctx){
  closeCam();
  const root = document.createElement("div"); root.id = "cam-root"; root.className = "cam";
  root.innerHTML = `<video playsinline muted autoplay></video><div class="hint">Boomerang: 4 Bilder in einer Sekunde</div>
    <div class="bar"><button class="cb" data-cam="cancel">Abbrechen</button><button class="shutter" data-cam="shoot" aria-label="Boomerang aufnehmen"></button><button class="cb" data-cam="flip">Drehen</button></div>`;
  document.body.appendChild(root);
  const video = root.querySelector("video");
  const start = async () => {
    try {
      if (camStream) camStream.getTracks().forEach(t => t.stop());
      camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:camFacing, width:{ ideal:720 }, height:{ ideal:960 } }, audio:false });
      video.srcObject = camStream; await video.play().catch(() => {});
    } catch(e){
      root.innerHTML = `<div class="msg"><b style="font-size:20px">Kamera nicht freigegeben</b><span>Du kannst stattdessen ein normales Foto machen.</span>
        <button class="btn" style="max-width:320px" data-cam="file">Foto aufnehmen</button><button class="cb" data-cam="cancel">Abbrechen</button></div>`;
    }

    const b = e.target.closest("[data-cam]"); if (!b) return;
    const a = b.dataset.cam;
    if (a === "cancel") closeCam();
    else if (a === "flip"){ camFacing = camFacing === "user" ? "environment" : "user"; start(); }
    else if (a === "file"){ closeCam(); const d = await pickPhoto(false, { max:720, square:false }); if (d) addProof(ctx, [d]); }
    else if (a === "shoot"){
      if (!video.videoWidth) return;
      b.disabled = true; const frames = [];
      for (let k = 0; k < 4; k++){
        root.classList.remove("snap"); void root.offsetWidth; root.classList.add("snap");
        const d = shrink(video, { max:360, square:false, q:0.7 }); if (d) frames.push(d);
        await new Promise(r => setTimeout(r, 140));

      if (frames.length){ addProof(ctx, frames); toast("Boomerang gespeichert"); buzz(30); }
    }

}

    while (bits >= 8){ out.push(acc & 255); acc >>>= 8; bits -= 8; }
    if (freeEnt > maxcode || clearFlg){
      if (clearFlg){ nBits = minSize + 1; maxcode = (1 << nBits) - 1; clearFlg = false; }

  output(clear);

  for (let i = 1; i < idx.length; i++){
    const c = idx[i]; const key = ent * 256 + c; const v = dict.get(key);
    if (v !== undefined){ ent = v; continue; }
    output(ent); ent = c;
    if (freeEnt < 4096) dict.set(key, freeEnt++);
    else { dict.clear(); freeEnt = eoi + 1; clearFlg = true; output(clear); }
  }
  output(ent); output(eoi);

}
async function makeGif(ids){
  const imgs = await Promise.all(ids.map(id => loadImg(photos[id])));
  const w = imgs[0].naturalWidth, h = imgs[0].naturalHeight;
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const ctx = cv.getContext("2d");
  const bytes = []; const push = (...b) => b.forEach(x => bytes.push(x)); const u16 = v => push(v & 255, (v >> 8) & 255);
  "GIF89a".split("").forEach(ch => push(ch.charCodeAt(0)));
  u16(w); u16(h); push(0xF7, 0, 0);
  for (let r = 0; r < 6; r++) for (let g = 0; g < 7; g++) for (let b = 0; b < 6; b++) push(r * 51, Math.round(g * 42.5), b * 51);
  for (let k = 252; k < 256; k++) push(0, 0, 0);
  push(0x21, 0xFF, 0x0B); "NETSCAPE2.0".split("").forEach(ch => push(ch.charCodeAt(0))); push(3, 1, 0, 0, 0);
  const bayer = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  const order = BOOM.filter(k => k < imgs.length);
  const cache = {};
  for (const fi of order){
    if (!cache[fi]){
      ctx.drawImage(imgs[fi], 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h).data; const ix = new Uint8Array(w * h);
      for (let y = 0, p = 0; y < h; y++) for (let x = 0; x < w; x++, p++){
        const t = bayer[(y & 3) * 4 + (x & 3)] / 16 - 0.47; const o = p * 4;
        const r = Math.min(5, Math.max(0, Math.round(d[o] / 51 + t)));
        const g = Math.min(6, Math.max(0, Math.round(d[o+1] / 42.5 + t)));
        const b = Math.min(5, Math.max(0, Math.round(d[o+2] / 51 + t)));
        ix[p] = r * 42 + g * 6 + b;
      }
      cache[fi] = lzw(ix, 8);
    }
    push(0x21, 0xF9, 0x04, 0x04); u16(12); push(0, 0);
    push(0x2C); u16(0); u16(0); u16(w); u16(h); push(0);
    push(8);
    const data = cache[fi];
    for (let i = 0; i < data.length; i += 255){ const chunk = data.slice(i, i + 255); push(chunk.length); chunk.forEach(x => bytes.push(x)); }
    push(0);
  }
  push(0x3B);
  return new Blob([new Uint8Array(bytes)], { type:"image/gif" });
}

/* ---- Downloads ---- */
let dl = null;
(async () => {
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch(e){ dl = null; }
  if (dl && state.phase === "end" && !headless) render();
})();
const canDownload = () => !!dl || !inSandbox;
const slug = s => String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") || "x";
function dataToBlob(d){
  const [head, b64] = d.split(",");
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:(head.match(/data:([^;]+)/) || [])[1] || "image/jpeg" });
}
function allPhotos(){
  const out = [];
  state.proofs.forEach((x, i) => {
    if (!photos[x.photo]) return;
    const q = P(x.pid); const base = `Beweisfotos/${String(i + 1).padStart(2, "0")}_${slug(q ? q.name : "Alle")}`;
    out.push({ proof:x, name: base + (x.frames && x.frames.length > 1 ? "_Boomerang.gif" : ".jpg") });
  });
  state.players.forEach(p => { if (p.photo && photos[p.photo]) out.push({ id:p.photo, name:`Selfies/${slug(p.name)}.jpg` }); });
  return out;
}
async function fileBlob(f){
  if (f.proof && f.proof.frames && f.proof.frames.length > 1) return makeGif(f.proof.frames.filter(id => photos[id]));
  return dataToBlob(photos[f.proof ? f.proof.photo : f.id]);
}
async function saveFile(filename, blob){
  if (dl) return dl.save({ filename, data:blob });
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return { status:"saved" };
}
function dlMsg(t){ const m = document.getElementById("dl-msg"); if (m) m.textContent = t; }
function dlError(e){
  const c = e && e.code;
  if (c === "declined") return dlMsg("");
  if (c === "rate_limited") return dlMsg("Es ist schon ein Speichern-Fenster offen.");
  dlMsg("Speichern hat nicht geklappt. Foto gedrückt halten und „Bild sichern“ wählen.");
}
async function saveAll(btn){
  const files = allPhotos(); if (!files.length || !canDownload()) return;
  btn.disabled = true; dlMsg("Wird gepackt …");
  try {
    if (window.JSZip){
      const zip = new JSZip();
      for (const f of files) zip.file(f.name, await fileBlob(f));
      const data = await zip.generateAsync({ type:"blob" });
      dlMsg("");
      const r = await saveFile(`Trinkwuerfel-${new Date().toISOString().slice(0,10)}.zip`, data);
      if (r && r.status === "saved") dlMsg("Gespeichert. Die ZIP-Datei liegt bei deinen Downloads.");
    } else {
      for (const f of files) await saveFile(f.name.split("/").pop(), await fileBlob(f));
      dlMsg("Gespeichert.");
    }
  } catch(e){ dlError(e); }
  btn.disabled = false;
}
async function saveOne(photoId){
  const f = allPhotos().find(x => x.proof && x.proof.photo === photoId); if (!f) return;
  try { await saveFile(f.name.split("/").pop(), await fileBlob(f)); } catch(e){ dlError(e); }
}

/* ---- Bedienung ---- */
function armed(btn){
  if (!btn.dataset.confirm || btn.dataset.armed === "1") return true;
  btn.dataset.armed = "1"; const orig = btn.innerHTML; btn.textContent = btn.dataset.confirm;
  setTimeout(() => { if (btn.isConnected){ btn.dataset.armed = ""; btn.innerHTML = orig; } }, 3200);
  return false;
}
let wakeLock = null;
async function keepAwake(){ try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); } catch(e){} }
document.addEventListener("visibilitychange", () => { if (state.phase === "game") keepAwake(); });
function wipeProofs(){ state.proofs.forEach(x => { dropPhoto(x.photo); (x.frames || []).forEach(dropPhoto); }); state.proofs = []; }

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act_ = el.dataset.act;
  if (act_ === "close-sheet"){ if (e.target === el || el.tagName === "BUTTON") closeSheet(); return; }
  if (act_ === "fx-skip"){ if (fxRoot.dataset.recap){ delete fxRoot.dataset.recap; } fxDone(); return; }
  const S = state.settings;
  switch (act_){
    case "sw": {
      const k = el.dataset.k;
      if (k === "ko") S.ko = !S.ko; else if (k === "cards") S.cards = !S.cards; else if (k.startsWith("a_")) S.addons[k.slice(2)] = !S.addons[k.slice(2)];
      savePrefs(); save(); const y = window.scrollY; render(); window.scrollTo(0, y); break;
    }
    case "order": S.order = el.dataset.k; savePrefs(); save(); { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case "hearts": S.hearts = +el.dataset.k; savePrefs(); save(); { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case "gtype": {
      state.config[+el.dataset.i].type = el.dataset.t; savePrefs(); save();
      const open = document.getElementById("glass-card").open; const y = window.scrollY; render(); document.getElementById("glass-card").open = open; window.scrollTo(0, y); break;
    }
    case "start-join": countEvent("spiel-gestartet", "Spiel gestartet"); act(() => eStartJoin()); draft = { name:"", photo:null }; render(); window.scrollTo(0,0); setTimeout(() => { const n = document.getElementById("join-name"); n && n.focus(); }, 60); break;
    case "to-intro": state.phase = "intro"; state.joining = false; save(); render(); break;
    case "selfie": { const d = await pickPhoto(true, { max:320, square:true }); if (d){ draft.photo = d; render(); } break; }
    case "all-in": act(() => eAllIn()); keepAwake(); break;
    case "peek-done": act(() => ePeekDone()); break;
    case "roll": doRoll(); break;
    case "confirm": act(() => eConfirm()); window.scrollTo(0,0); break;
    case "card": {
      const r = act(() => ePlayCard());
      if (r === "none") toast("Du hast keine Karte"); else if (r === "mismatch") toast("Deine Karte passt hier nicht");
      break;
    }
    case "konter": konterSheet(); break;
    case "konter-by": {
      const r = act(() => eKonter(el.dataset.id));
      if (r === "ok"){ closeSheet(); break; }
      const nm = P(el.dataset.id) ? P(el.dataset.id).name : "";
      const sh = sheetRoot.querySelector(".sheet");

    case "pick": act(() => ePickPlayer(el.dataset.id)); break;

    case "history": historySheet(); break;
    case "rules": rulesSheet(); break;
    case "menu": menuSheet(); break;
    case "player": playerSheet(el.dataset.id); break;

      save(); render(); keepAwake(); break;
    }
    case "recap": fxQ.push({ type:"recap" }); pumpFx(); break;
    case "rematch": wipeProofs(); act(() => eRematch()); window.scrollTo(0, 0); keepAwake(); break;
    case "reset": {

      wipeProofs(); state.players.forEach(p => p.photo && dropPhoto(p.photo));
      const keep = { settings:state.settings, config:state.config };
      state = fresh(); state.settings = keep.settings; state.config = keep.config;
      draft = { name:"", photo:null }; undoStack = []; fxQ.length = 0; fxDone(); save(); closeSheet(); render(); window.scrollTo(0, 0); break;
    }
    case "save-all": saveAll(el); break;
    case "save-one": saveOne(el.dataset.ph); break;
  }
});

function boot(data){

  if (state.phase === "game" && !cur()) state.phase = state.players.length ? "end" : "intro";
  if (state.phase === "peek" && !state.peekQueue.length) state.phase = "game";
